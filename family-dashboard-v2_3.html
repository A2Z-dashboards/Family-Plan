<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }

        .carousel {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            margin: 0;
            padding: 0;
        }

        .slide.active {
            display: block;
        }

        .slide iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
        }

        .timer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }

        .dots {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        .button {
            position: fixed;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 100;
            transition: background 0.3s;
        }

        .button:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        #nextBtn {
            bottom: 20px;
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="carousel">
        <!-- Slide 1: To Do List -->
        <div class="slide active" id="slide1">
            <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSoW9iHQE3EQaUedVKfmwu32cUZkzuHtr-ifLUfwC827AuU2y35sZDyFbw93o1B4owXmcQpnqmcc4Tv/pubhtml?widget=true&headers=false"></iframe>
        </div>

        <!-- Slide 2: Calendar -->
        <div class="slide" id="slide2">
            <iframe src="https://calendar.google.com/calendar/embed?src=2df1ecb2223966206e5e62b5eb8b20c8d381824522d766e199c5283f6f97a992%40group.calendar.google.com&ctz=Asia%2FDubai&mode=agenda"></iframe>
        </div>

        <!-- Slide 3: Prayer Times -->
        <div class="slide" id="slide3">
            <div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 100%); color: white; font-family: Arial, sans-serif; padding: 30px; overflow: hidden;">
                <h1 style="text-align: center; font-size: 42px; margin-bottom: 20px; margin-top: 10px;">Prayer Times - Dubai</h1>
                <div style="display: flex; gap: 40px; flex: 1; align-items: center;">
                    <div style="flex: 1; font-size: 28px; line-height: 2.2;">
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Fajr:</span> <span style="font-size: 32px; font-weight: bold; color: #90EE90;" id="fajr">--:--</span></div>
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Sunrise:</span> <span style="font-size: 32px; font-weight: bold; color: #FFD700;" id="sunrise">--:--</span></div>
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Dhuhr:</span> <span style="font-size: 32px; font-weight: bold; color: #87CEEB;" id="dhuhr">--:--</span></div>
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Asr:</span> <span style="font-size: 32px; font-weight: bold; color: #FFA500;" id="asr">--:--</span></div>
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Maghrib:</span> <span style="font-size: 32px; font-weight: bold; color: #FF6B6B;" id="maghrib">--:--</span></div>
                        <div style="margin: 10px 0;"><span style="font-weight: bold; display: inline-block; width: 150px;">Isha:</span> <span style="font-size: 32px; font-weight: bold; color: #9370DB;" id="isha">--:--</span></div>
                    </div>
                    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 40px; border-radius: 15px; text-align: center;">
                        <h2 style="font-size: 36px; margin-bottom: 20px; color: #FFD700;">Next Salah</h2>
                        <div style="font-size: 56px; font-weight: bold; margin-bottom: 30px; color: #90EE90;" id="nextSalahName">--</div>
                        <div style="font-size: 72px; font-weight: bold; font-family: 'Courier New', monospace; color: #FFD700; letter-spacing: 5px;" id="countdown">00:00:00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Slide 4: Al Jazeera News -->
        <div class="slide" id="slide4">
            <iframe src="https://www.aljazeera.com/" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <!-- Slide 5: Football News -->
        <div class="slide" id="slide5">
            <iframe src="https://www.skysports.com/football" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <div class="timer" id="timer">15</div>

    <button class="button" id="nextBtn" onclick="nextSlide()">Next</button>

    <div class="dots">
        <div class="dot active" onclick="goToSlide(0)"></div>
        <div class="dot" onclick="goToSlide(1)"></div>
        <div class="dot" onclick="goToSlide(2)"></div>
        <div class="dot" onclick="goToSlide(3)"></div>
        <div class="dot" onclick="goToSlide(4)"></div>
    </div>

    <script>
        let currentSlide = 0;
        let timeLeft = 15;
        let TOTAL_TIME = 15;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const slideTitles = ['To Do List', 'Family Calendar', 'Prayer Times', 'Al Jazeera News', 'Football News'];
        
        // All slides get 15 seconds, except news and football get 10
        const slideTiming = [15, 15, 15, 10, 10];

        async function fetchPrayerTimes() {
            try {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                
                const response = await fetch(`https://api.aladhan.com/v1/timingsByCity/${day}-${month}-${year}?city=Dubai&country=UAE&method=5`);
                const data = await response.json();
                
                if (data.data && data.data.timings) {
                    const times = data.data.timings;
                    document.getElementById('fajr').textContent = times.Fajr;
                    document.getElementById('sunrise').textContent = times.Sunrise;
                    document.getElementById('dhuhr').textContent = times.Dhuhr;
                    document.getElementById('asr').textContent = times.Asr;
                    document.getElementById('maghrib').textContent = times.Maghrib;
                    document.getElementById('isha').textContent = times.Isha;
                    startCountdown(times);
                }
            } catch (error) {
                console.log('Prayer times error:', error);
                const fallbackTimes = {
                    Fajr: '05:30',
                    Sunrise: '06:45',
                    Dhuhr: '12:15',
                    Asr: '15:30',
                    Maghrib: '18:00',
                    Isha: '19:30'
                };
                document.getElementById('fajr').textContent = fallbackTimes.Fajr;
                document.getElementById('sunrise').textContent = fallbackTimes.Sunrise;
                document.getElementById('dhuhr').textContent = fallbackTimes.Dhuhr;
                document.getElementById('asr').textContent = fallbackTimes.Asr;
                document.getElementById('maghrib').textContent = fallbackTimes.Maghrib;
                document.getElementById('isha').textContent = fallbackTimes.Isha;
                startCountdown(fallbackTimes);
            }
        }

        function startCountdown(times) {
            const prayers = [
                { name: 'Fajr', time: times.Fajr },
                { name: 'Sunrise', time: times.Sunrise },
                { name: 'Dhuhr', time: times.Dhuhr },
                { name: 'Asr', time: times.Asr },
                { name: 'Maghrib', time: times.Maghrib },
                { name: 'Isha', time: times.Isha }
            ];

            function updateCountdown() {
                const now = new Date();
                const currentTimeMinutes = now.getHours() * 60 + now.getMinutes();
                
                let nextPrayer = null;
                
                for (let prayer of prayers) {
                    const [hours, minutes] = prayer.time.split(':').map(Number);
                    const prayerTimeMinutes = hours * 60 + minutes;
                    
                    if (prayerTimeMinutes > currentTimeMinutes) {
                        nextPrayer = prayer;
                        break;
                    }
                }
                
                if (!nextPrayer) {
                    nextPrayer = prayers[0];
                }
                
                document.getElementById('nextSalahName').textContent = nextPrayer.name;
                
                const [hours, minutes] = nextPrayer.time.split(':').map(Number);
                const prayerDate = new Date();
                prayerDate.setHours(hours, minutes, 0, 0);
                
                if (prayerDate < now) {
                    prayerDate.setDate(prayerDate.getDate() + 1);
                }
                
                const diff = prayerDate - now;
                const countdownHours = Math.floor(diff / 3600000);
                const countdownMinutes = Math.floor((diff % 3600000) / 60000);
                const countdownSeconds = Math.floor((diff % 60000) / 1000);
                
                const countdownStr = String(countdownHours).padStart(2, '0') + ':' +
                                   String(countdownMinutes).padStart(2, '0') + ':' +
                                   String(countdownSeconds).padStart(2, '0');
                
                document.getElementById('countdown').textContent = countdownStr;
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function showSlide(n) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            
            slides[n].classList.add('active');
            dots[n].classList.add('active');
            
            TOTAL_TIME = slideTiming[n];
            timeLeft = TOTAL_TIME;
            updateTimer();
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        function updateTimer() {
            document.getElementById('timer').textContent = timeLeft;
        }

        setInterval(() => {
            timeLeft--;
            updateTimer();
            if (timeLeft <= 0) {
                nextSlide();
            }
        }, 1000);

        fetchPrayerTimes();
        showSlide(0);
    </script>
</body>
</html>
