name: Update News Dashboard

on:
  schedule:
    # 6 AM Dubai time (2 AM UTC)
    - cron: '0 2 * * *'
    # 6 PM Dubai time (2 PM UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch and process news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python3 << 'EOF'
          import json
          import requests
          from datetime import datetime
          
          API_KEY = "${{ secrets.NEWS_API_KEY }}"
          
          # Fetch global news
          global_response = requests.get(
            f'https://newsapi.org/v2/top-headlines?sortBy=publishedAt&apiKey={API_KEY}&pageSize=20'
          )
          
          # Fetch UK news
          uk_response = requests.get(
            f'https://newsapi.org/v2/top-headlines?country=gb&sortBy=publishedAt&apiKey={API_KEY}&pageSize=20'
          )
          
          global_news = global_response.json().get('articles', [])
          uk_news = uk_response.json().get('articles', [])
          
          # Filter for Manchester-specific news
          manchester_news = [
            article for article in uk_news 
            if 'manchester' in article['title'].lower() or 'manchester' in article['description'].lower()
          ]
          
          # Build formatted news
          news_items = []
          
          # Add top global news (1 item)
          if global_news:
            article = global_news[0]
            title = article.get('title', '').replace(' - ', ': ')
            news_items.append({
              'text': title[:120],
              'category': 'Global'
            })
          
          # Add UK news (2-4 items)
          for article in uk_news[0:4]:
            if len(news_items) < 5:
              title = article.get('title', '').replace(' - ', ': ')
              news_items.append({
                'text': title[:120],
                'category': 'UK'
              })
          
          # Add Manchester news (5-6 items)
          for article in manchester_news[0:2]:
            if len(news_items) < 6:
              title = article.get('title', '').replace(' - ', ': ')
              news_items.append({
                'text': title[:120],
                'category': 'Manchester'
              })
          
          # Pad to 6 items if needed
          while len(news_items) < 6:
            news_items.append({'text': 'No more news at this time', 'category': 'Other'})
          
          # Save to file
          output = {
            'updated': datetime.utcnow().isoformat(),
            'news': news_items[:6]
          }
          
          with open('news-data.json', 'w') as f:
            json.dump(output, f)
          
          print(f'Generated {len(news_items)} news items')
          EOF
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add news-data.json
          git commit -m "Update news data" || exit 0
          git push
